<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Mohammad Sobhan Saririan — Software Engineer</title>
  <desc id="desc">Animated engineering profile header with a violet systems path that pauses and pulses at each node before moving to the next area.</desc>
  <defs>
    <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#6d28d9"/><stop offset="0.55" stop-color="#7c3aed"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <radialGradient id="pulse"><stop offset="0" stop-color="#ffffff"/><stop offset="0.22" stop-color="#ede9fe"/><stop offset="0.55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-200%" y="-200%" width="400%" height="400%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 L 0 0 0 36" fill="none" stroke="#d8dee4" stroke-width="1"/></pattern>
    <path id="route" d="M 795 92 C 860 72, 936 84, 959 132 C 980 175, 934 196, 892 180 C 835 158, 808 204, 838 242 C 865 276, 929 276, 965 248 C 1002 220, 1046 234, 1054 278 C 1061 316, 1024 342, 982 333 C 930 321, 894 344, 866 371"/>
  </defs>
  <rect x="1" y="1" width="1198" height="428" rx="20" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="720" y="1" width="478" height="428" rx="20" fill="url(#grid)" opacity="0.78"/>
  <path d="M720 20V410" stroke="#d0d7de"/>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="56" y="77" fill="#7c3aed" font-size="13" font-weight="700" letter-spacing="4">SOFTWARE ENGINEER</text>
    <text x="56" y="144" fill="#1f2328" font-size="50" font-weight="700" letter-spacing="-1.6">Mohammad Sobhan Saririan</text>
    <text x="56" y="188" fill="#59636e" font-size="20">Backend Systems · Automation · Data · Applied AI · Product Engineering</text>
    <rect x="56" y="226" width="56" height="3" rx="2" fill="#7c3aed"><animate attributeName="width" values="42;88;42" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.65;1;0.65" dur="7s" repeatCount="indefinite"/></rect>
    <text x="56" y="284" fill="#656d76" font-size="17">Building software across real operational workflows.</text>
    <text x="56" y="317" fill="#656d76" font-size="17">Moving between systems, backend, data, automation and applied AI.</text>
    <text x="56" y="381" fill="#656d76" font-size="12" font-weight="600" letter-spacing="2.4">SYSTEMS / BACKEND / DATA / AUTOMATION / APPLIED AI / PRODUCT</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round"><use href="#route" stroke="#d0d7de" stroke-width="16" opacity="0.4"/><use href="#route" stroke="url(#edge)" stroke-width="2.4"/><use href="#route" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="3 12" opacity="0.45"><animate attributeName="stroke-dashoffset" from="0" to="-60" dur="5s" repeatCount="indefinite"/></use></g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.7">
    <g transform="translate(795 92)"><circle r="7" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="-8" y="-18" text-anchor="end" fill="#656d76">SYSTEMS</text></g>
    <g transform="translate(959 132)"><circle r="7" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="16" y="4" fill="#656d76">BACKEND</text></g>
    <g transform="translate(838 242)"><circle r="7" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="-14" y="4" text-anchor="end" fill="#656d76">DATA</text></g>
    <g transform="translate(965 248)"><circle r="7" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="16" y="4" fill="#656d76">AUTOMATION</text></g>
    <g transform="translate(1054 278)"><circle r="7" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="16" y="4" fill="#656d76">APPLIED AI</text></g>
    <g transform="translate(866 371)"><circle r="7" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="-14" y="4" text-anchor="end" fill="#656d76">PRODUCT</text></g>
  </g>
