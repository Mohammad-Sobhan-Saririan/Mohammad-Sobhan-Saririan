<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="#0D1117" stroke="#30363D"/>
  <g opacity="0.6" stroke="#21262D" stroke-width="1">
    <path d="M760 0V320"/><path d="M840 0V320"/><path d="M920 0V320"/><path d="M1000 0V320"/><path d="M1080 0V320"/>
    <path d="M760 64H1200"/><path d="M760 128H1200"/><path d="M760 192H1200"/><path d="M760 256H1200"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace">
    <text x="56" y="76" fill="#58A6FF" font-size="13" letter-spacing="6">SOFTWARE ENGINEER</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="56" y="146" fill="#F0F6FC" font-size="46" font-weight="650">Mohammad Sobhan Saririan</text>
    <text x="56" y="190" fill="#B1BAC4" font-size="22">AI Systems · Backend Engineering · Product Engineering</text>
    <rect x="56" y="222" width="48" height="3" rx="1.5" fill="#2F81F7">
      <animate attributeName="width" values="48;92;48" dur="8s" repeatCount="indefinite" keyTimes="0;0.15;1"/>
    </rect>
    <text x="56" y="266" fill="#8B949E" font-size="17">Software for real operational workflows.</text>
  </g>

  <!-- signature systems trace -->
  <g transform="translate(782 58)">
    <g stroke="#30363D" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
      <path d="M6 170H78V132H150V88H222V46H302"/>
      <path d="M48 24H110V58H182V108H252V146H360"/>
    </g>

    <!-- draw accent path -->
    <path d="M6 170H78V132H150V88H222V46H302" stroke="#2F81F7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;0;0" keyTimes="0;0.28;1" dur="8s" repeatCount="indefinite"/>
    </path>

    <!-- moving pulse -->
    <circle r="4.5" fill="#58A6FF">
      <animateMotion dur="8s" repeatCount="indefinite" keyTimes="0;0.28;1" keyPoints="0;1;1" calcMode="linear" path="M6 170H78V132H150V88H222V46H302"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.26;0.31;1" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- nodes -->
    <g fill="#0D1117" stroke="#8B949E" stroke-width="1.2">
      <circle cx="6" cy="170" r="4"/><circle cx="78" cy="132" r="4"/><circle cx="150" cy="88" r="4"/><circle cx="222" cy="46" r="4"/><circle cx="302" cy="46" r="4"/>
      <circle cx="48" cy="24" r="3"/><circle cx="110" cy="58" r="3"/><circle cx="182" cy="108" r="3"/><circle cx="252" cy="146" r="3"/><circle cx="360" cy="146" r="3"/>
    </g>
    <g fill="#0D1117" stroke="#58A6FF" stroke-width="1.8">
      <circle cx="78" cy="132" r="5"><animate attributeName="r" values="5;5;8;5;5" keyTimes="0;0.08;0.11;0.16;1" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="88" r="5"><animate attributeName="r" values="5;5;8;5;5" keyTimes="0;0.13;0.16;0.21;1" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="222" cy="46" r="5"><animate attributeName="r" values="5;5;8;5;5" keyTimes="0;0.18;0.21;0.26;1" dur="8s" repeatCount="indefinite"/></circle>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" letter-spacing="3" fill="#8B949E">
      <text x="314" y="28">SYSTEMS</text>
      <text x="314" y="50">BACKEND</text>
      <text x="314" y="72">AUTOMATION</text>
      <text x="314" y="94">DATA</text>
